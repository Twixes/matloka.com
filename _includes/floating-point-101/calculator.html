<link rel="stylesheet" href="{{ '/assets/floating-point-101/calculator.css' | relative_url }}">
<div class="float-calculator" aria-label="IEEE 754 Floating Point Calculator">
    <div class="float-calculator__input-row">
        <input type="text" value="10" aria-label="Floating-point value" autocomplete="off" spellcheck="false">
        <span class="precision">double precision</span>
    </div>
    <div class="scientific-notation">
        <span class="formula">(-1)^<span class="sign"></span> * <button class="significand" type="button" aria-label="Show significand in binary"><span class="leading"></span>.<span class="significand-fraction"></span><sub hidden>2</sub></button> * 2^(<span class="exponent"></span>-1023)</span>
        <span class="special-value" hidden></span>
    </div>
    <div class="bit-scroll" tabindex="0" role="group" aria-label="64 bits; scroll horizontally on small screens">
        <div class="bit-array" role="group" aria-label="Toggle individual bits"></div>
    </div>
    <div class="legend" aria-hidden="true">
        <span class="sign">sign</span><span class="exponent">exponent</span><span class="significand-fraction">significand/mantissa</span>
    </div>
    <div class="suggestions"><i>try these:</i></div>
    <noscript>Enable JavaScript to use the calculator.</noscript>
</div>
<script src="{{ '/assets/floating-point-101/calculator.js' | relative_url }}" defer></script>
